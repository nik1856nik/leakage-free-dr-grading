[project]
name = "dr-detection"
version = "0.1.0"
description = "Automated diabetic retinopathy detection and five-class severity grading: literature-based model reproduction and comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "opencv-python-headless>=4.10",
    "albumentations>=1.4",
    "pillow>=10.4",
    "imagehash>=4.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "grad-cam>=1.5",
    "kaggle>=1.8",
    "six>=1.17.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
